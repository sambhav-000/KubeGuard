apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeguard-demo-app
  namespace: kubeguard-demo
  labels:
    app.kubernetes.io/name: kubeguard-demo-app
    app.kubernetes.io/part-of: kubeguard
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        app.kubernetes.io/name: kubeguard-demo-app
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kubeguard-demo-service
  namespace: kubeguard-demo
  labels:
    app.kubernetes.io/name: kubeguard-demo-app
    app.kubernetes.io/part-of: kubeguard
    app: demo-app
spec:
  type: ClusterIP
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 80

